# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1536m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# ----------------------------------------------------------------------------
# Este ficheiro descreve a MÁQUINA que compila o APK (como o local.properties
# com o sdk.dir). Noutra máquina são três linhas a apagar e a substituir pelo
# JDK e o truststore dessa máquina.
#
# JDK: o Gradle precisa de uma JVM. Este PC não tem JAVA_HOME no ambiente nem
# `java` no PATH, por isso apontamos directamente para o JBR do Android Studio
# (OpenJDK). Sem esta linha o `gradlew.bat` falha com "JAVA_HOME is not set".
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr

# TLS: este PC tem o Avast a fazer inspecção HTTPS, que re-emite certificados
# assinados pela CA local "Avast Web/Mail Shield Root". O JDK do Android Studio
# não conhece essa CA, pelo que o Gradle falha a descarregar dependências com
# "PKIX path building failed".
#
# A solução NÃO é desactivar a validação TLS: é usar um truststore que contém
# as CA standards MAIS essa CA local. Foi criado a partir do cacerts do JBR com
# `keytool -importcert`. Para regenerar depois de actualizar o Avast/JDK:
#   cp "<JBR>/lib/security/cacerts" ~/.elara/android-truststore.jks
#   "<JBR>/bin/keytool" -importcert -alias avast-web-mail-shield-root \
#     -file elara-avast.cer -keystore ~/.elara/android-truststore.jks \
#     -storepass changeit -noprompt
# ----------------------------------------------------------------------------
systemProp.javax.net.ssl.trustStore=C:/Users/DELL/.elara/android-truststore.jks
systemProp.javax.net.ssl.trustStorePassword=changeit
